site_name: YGSTUDY
site_url: https://gyutory.github.io/YGSTUDY/
site_description: 백엔드 엔지니어 강영규의 기술 노트 — 시스템과 인프라, 그 사이의 모든 것
site_author: GYUTORY

repo_name: gyutory/YGSTUDY
repo_url: https://github.com/gyutory/YGSTUDY

docs_dir: Develop

hooks:
  - tools/volatility_banner.py
  - tools/inject_build_meta.py
  - tools/related_docs.py

theme:
  name: material
  language: ko
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: blue
      toggle:
        icon: material/weather-night
        name: 다크 모드로 전환
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: 라이트 모드로 전환
  font: false
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.indexes
    - navigation.footer
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tooltips
    - toc.follow
  icon:
    logo: material/book-open-page-variant
    repo: fontawesome/brands/github

plugins:
  - search:
      lang:
        - ko
        - en
      separator: '[\s\-\._]+'
  - awesome-pages
  - tags
  # 문서를 옮길 때 기존 URL이 죽지 않도록 여기에 이전 경로 -> 새 경로를 남긴다
