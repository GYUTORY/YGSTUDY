site_name: YGSTUDY
site_url: https://gyutory.github.io/YGSTUDY/
site_description: 백엔드 엔지니어 강영규의 기술 노트 — 시스템과 인프라, 그 사이의 모든 것
site_author: GYUTORY

repo_name: GYUTORY/YGSTUDY
repo_url: https://github.com/GYUTORY/YGSTUDY

docs_dir: Develop

theme:
  name: material
  language: ko
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: blue
      toggle:
        icon: material/weather-night
        name: 다크 모드로 전환
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: 라이트 모드로 전환
  font: false
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.indexes
    - navigation.footer
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tooltips
    - toc.follow
  icon:
    logo: material/book-open-page-variant
    repo: fontawesome/brands/github

plugins:
  - search:
      lang:
        - ko
        - en
      separator: '[\s\-\.]+'
  - awesome-pages
  - tags
  # 문서를 옮길 때 기존 URL이 죽지 않도록 여기에 이전 경로 -> 새 경로를 남긴다
  - redirects:
      redirect_maps:
        # Infra/DevOps 경계 정리 (2026-08-01): 겹치던 주제를 DevOps로 모음
        'Infra/CI_CD/CI_CD_Pipeline.md': 'DevOps/CI_CD/CI_CD_Pipeline.md'
        'Infra/GitOps/Git_Ops_Argo_CD.md': 'DevOps/GitOps/Argo_CD_운영_실무.md'
        'Infra/Infrastructure_as_Code/Terraform.md': 'DevOps/Infrastructure_as_Code/Terraform_운영_실무.md'
        'Infra/Image_Build/Packer.md': 'DevOps/Infrastructure_as_Code/Packer.md'
        'Infra/Kubernetes/Kubernetes_Architecture.md': 'DevOps/Kubernetes/Kubernetes_Architecture.md'
        'Infra/Kubernetes/Reconciliation_Loop.md': 'DevOps/Kubernetes/Reconciliation_Loop.md'
        'Infra/Monitoring/Prometheus_Grafana.md': 'DevOps/Monitoring/Prometheus_Grafana.md'
        # 파일명 오타 수정 (Makrer -> Marker)
        'Language/Java/객체지향 프로그래밍 (OOP)/interface/Makrer_Interface.md': 'Language/Java/객체지향 프로그래밍 (OOP)/interface/Marker_Interface.md'
        # OMO는 AI가 아니라 커머스 아키텍처 주제라 Architecture로 이동
        'AI/OMO/OMO.md': 'Architecture/OMO/OMO_운영_실무.md'
  - git-revision-date-localized:
      enable_creation_date: true
      type: date
      locale: ko
  - minify:
      minify_html: true

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.critic
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.keys
  - pymdownx.tasklist:
      custom_checkbox: true
  - admonition
  - attr_list
  - md_in_html
  - def_list
  - footnotes
  - tables
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true
      toc_depth: 3
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds: {case: lower}

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/GYUTORY
  generator: false

copyright: Copyright &copy; 2024 - 2026 GYUTORY

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/extra.js
