name: Quality Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Docs Quality Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements-docs.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements-docs.txt

      # 검사 스텝 정의는 .github/actions/docs-checks 한 곳에만 둔다.
      # PR 에서는 base.sha, push 에서는 before 가 기준 커밋이 된다.
      - name: Docs checks
        uses: ./.github/actions/docs-checks
        with:
          before_sha: ${{ github.event.pull_request.base.sha || github.event.before }}
