name: Deploy MkDocs to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-docs
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements-docs.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements-docs.txt

      - name: Docs checks
        uses: ./.github/actions/docs-checks
        with:
          # 수동 실행(workflow_dispatch)과 신규 브랜치 첫 푸시에서는 이 값이
          # 비어 있어 90일 전체 스캔으로 떨어지고, 과거 무출처 주장 24건이
          # 통째로 걸려 배포가 막힌다. github.sha 를 주면 diff 가 비어
          # 새 주장 0건으로 통과한다 — 과거 빚은 그대로 두고 배포만 연다.
          before_sha: ${{ github.event.before || github.sha }}

      # 위 docs-checks 가 이미 FULL_BUILD=true 로 site/ 를 만들었다.
      # 예전에는 여기서 mkdocs gh-deploy 를 불러 같은 빌드를 한 번 더 했다
      # — 풀 빌드가 266초라 매 배포에서 그만큼을 두 번 낸 셈이다.
      # 만들어진 site/ 를 그대로 올린다. ghp-import 는 mkdocs 의존성이라
      # 이미 설치돼 있고, gh-deploy 가 내부에서 쓰는 도구도 이것이다.
      #
      # 검증 스텝이 실패하면 site/ 가 없거나 낡은 상태로 남으므로 배포도 진행되지 않는다
      # (composite action 의 실패가 job 을 멈춘다).
      - name: Deploy
        run: |
          test -f site/index.html || { echo "site/ 가 없다 — 검증 스텝의 빌드를 확인하라"; exit 1; }
          ghp-import --no-jekyll --push --force \
            --message "Deployed ${{ github.sha }} with MkDocs" site
