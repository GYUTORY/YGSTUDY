name: Deploy MkDocs to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-docs
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements-docs.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements-docs.txt

      - name: Docs checks
        uses: ./.github/actions/docs-checks
        with:
          # 수동 실행(workflow_dispatch)과 신규 브랜치 첫 푸시에서는 이 값이
          # 비어 있어 90일 전체 스캔으로 떨어지고, 과거 무출처 주장 24건이
          # 통째로 걸려 배포가 막힌다. github.sha 를 주면 diff 가 비어
          # 새 주장 0건으로 통과한다 — 과거 빚은 그대로 두고 배포만 연다.
          before_sha: ${{ github.event.before || github.sha }}

      - name: Deploy
        env:
          # FULL_BUILD 가 없으면 minify·rss·git-revision-date 가 전부 꺼진 채 배포된다.
          # 검증 스텝(docs-checks)에만 붙어 있어서, 실제로 나가는 사이트는
          # RSS 피드가 없는데 1,349개 페이지가 피드 링크를 광고하고(404),
          # HTML 은 압축되지 않고(2,864줄 vs 136줄), 문서마다 최종 수정일이 사라졌다.
          FULL_BUILD: "true"
          DISABLE_MKDOCS_2_WARNING: "true"
        run: mkdocs gh-deploy --force
