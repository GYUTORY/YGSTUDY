name: Deploy MkDocs to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-docs
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements-docs.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements-docs.txt

      - name: Docs checks
        uses: ./.github/actions/docs-checks
        with:
          before_sha: ${{ github.event.before }}

      - name: Deploy
        env:
          # FULL_BUILD 가 없으면 minify·rss·git-revision-date 가 전부 꺼진 채 배포된다.
          # 검증 스텝(docs-checks)에만 붙어 있어서, 실제로 나가는 사이트는
          # RSS 피드가 없는데 1,349개 페이지가 피드 링크를 광고하고(404),
          # HTML 은 압축되지 않고(2,864줄 vs 136줄), 문서마다 최종 수정일이 사라졌다.
          FULL_BUILD: "true"
          DISABLE_MKDOCS_2_WARNING: "true"
        run: mkdocs gh-deploy --force
