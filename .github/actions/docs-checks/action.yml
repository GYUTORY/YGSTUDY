name: Docs Quality Checks
description: |
  태그·프론트매터·링크·출처·빌드 검사.
  검사 스텝 정의는 이 파일 한 곳에만 있다 — 두 워크플로가 여기를 참조한다.

inputs:
  before_sha:
    description: 이전 커밋 SHA (check_sources push diff 모드)
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Check tags
      shell: bash
      run: python3 tools/gen_tags.py || true      # 태그 정리 완료 후 --strict 복원

    - name: Check frontmatter
      shell: bash
      run: python3 tools/check_frontmatter.py --strict

    # 머메이드 파스 에러는 원인 줄이 아니라 그 아래 줄을 가리켜 추적이 헛돈다.
    # 원인(sequenceDiagram 안의 이름 있는 HTML 엔티티)을 직접 짚는다.
    - name: Check mermaid entities
      shell: bash
      run: python3 tools/check_mermaid_entities.py

    - name: Check internal links
      shell: bash
      run: python3 tools/check_links.py --strict

    # 출처 검사는 두 겹으로 좁힌다.
    #   BEFORE_SHA → 이번 푸시에서 바뀐 파일만 고른다
    #   같은 SHA 를 base_ref 로 써서 그 파일의 "새로 추가된 줄"만 본다
    # 이렇게 해야 오래된 문서를 한 줄만 고쳐도 과거 무출처 주장이 걸리는 일이 없다.
    # 오탐 패턴 정리(utf8mb4·RFC·단일 숫자 버전)까지 끝나 strict 로 올렸다.
    - name: Check sources
      shell: bash
      env:
        BEFORE_SHA: ${{ inputs.before_sha }}
        AFTER_SHA: ${{ github.sha }}
      run: python3 tools/check_sources.py --strict

    - name: Build strict
      shell: bash
      run: mkdocs build --strict
