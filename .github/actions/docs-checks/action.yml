name: Docs Quality Checks
description: |
  태그·프론트매터·링크·출처·빌드 검사.
  검사 스텝 정의는 이 파일 한 곳에만 있다 — 두 워크플로가 여기를 참조한다.

inputs:
  before_sha:
    description: 이전 커밋 SHA (check_sources push diff 모드)
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Check tags
      shell: bash
      run: python3 tools/gen_tags.py --strict

    - name: Check frontmatter
      shell: bash
      run: python3 tools/check_frontmatter.py --strict

    # 머메이드 파스 에러는 원인 줄이 아니라 그 아래 줄을 가리켜 추적이 헛돈다.
    # 원인(sequenceDiagram 안의 이름 있는 HTML 엔티티)을 직접 짚는다.
    - name: Check mermaid entities
      shell: bash
      run: python3 tools/check_mermaid_entities.py

    # 도구 자체 회귀 테스트. 걸어 두지 않아서 반환값이 튜플로 바뀐 뒤에도
    # 아무도 모른 채 깨져 있었다(ValueError). 검사 도구가 조용히 죽으면
    # 그 뒤의 모든 통과가 의미가 없다.
    - name: Test link checker
      shell: bash
      run: python3 tools/tests/test_check_links.py

    - name: Check internal links
      shell: bash
      run: python3 tools/check_links.py --strict

    # 출처 검사는 두 겹으로 좁힌다.
    #   BEFORE_SHA → 이번 푸시에서 바뀐 파일만 고른다
    #   같은 SHA 를 base_ref 로 써서 그 파일의 "새로 추가된 줄"만 본다
    # 이렇게 해야 오래된 문서를 한 줄만 고쳐도 과거 무출처 주장이 걸리는 일이 없다.
    # 패턴을 정밀화해 `|| true` 를 걷어냈다. 전체 스캔 기준 131건 -> 24건이 됐고,
    # 남은 24건은 "4배 빠르다"·"90% 감소" 같은 실제 무출처 정량 주장이다.
    # 그 24건을 지금 막으면 CI 가 계속 빨간불이므로(출처를 지어낼 수는 없다)
    # 위 두 겹으로 "이번 푸시에서 새로 추가된 줄"만 본다 — 새 주장은 막고 과거 빚은 남긴다.
    - name: Check sources
      shell: bash
      env:
        BEFORE_SHA: ${{ inputs.before_sha }}
        AFTER_SHA: ${{ github.sha }}
      run: python3 tools/check_sources.py --strict

    - name: Build strict
      shell: bash
      env:
        DISABLE_MKDOCS_2_WARNING: "true"
        FULL_BUILD: "true"   # CI 는 minify·rss·git-date 포함 전체 빌드
      run: mkdocs build --strict

    # raw <img> 는 mkdocs 가 경로를 재작성하지 않아 소스 검사로는 안 잡힌다.
    # 빌드 산출물 기준으로 한 번 더 본다.
    - name: Check built assets
      shell: bash
      run: python3 tools/check_built_assets.py site --strict

    # redirect_maps 315개의 스텁 페이지가 실제로 생성됐고 meta refresh 와
    # 목적지까지 살아 있는지 본다. 경로가 '/root/YGSTUDY' 로 박혀 있어
    # 오래 죽어 있던 도구다 — 호출처가 0곳이라 아무도 몰랐다.
    # 게이트가 아니다. 낡은 전제 후보를 목록으로만 뽑는다.
    # 자동 검사가 구조적으로 불가능한 축이라(바깥이 움직였는지를 알아야 판정된다)
    # 사람이 분기에 한 번 훑을 대상을 좁혀 두는 용도다.
    # 스코프가 붙은 문장은 자동으로 빠지므로 규약이 정착할수록 목록이 줄어든다.
    - name: List support claims (non-blocking)
      shell: bash
      run: python3 tools/list_support_claims.py --stats

    - name: Check redirects
      shell: bash
      env:
        SITE_DIR: site
      run: python3 tools/check_redirects.py
